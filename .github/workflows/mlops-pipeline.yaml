name: MLOps Pipeline
on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-north-1
  S3_BUCKET: churn-model-data-9109

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Use the built-in GitHub token to access the repository

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Load training data using DVC
        run: |
          dvc pull data/churn_data.csv.dvc

      - name: Train model
        run: |
          mkdir -p models
          python train.py

      - name: Upload model to S3
        run: |
          aws s3 cp models/churn_model.pkl s3://${{ env.S3_BUCKET }}/models/churn_model_v_${{ github.run_id }}.pkl
          echo "Model uploaded to S3 bucket: ${{ env.S3_BUCKET }}"

      - name: Edit InferenceService YAML
        run: |
          MODEL_URI="s3://${{ env.S3_BUCKET }}/models/churn_model_v_${{ github.run_id }}.pkl"
          sed -i "s|storageUri: .*|storageUri: ${MODEL_URI}|g" k8s/inference.yaml

      - name: Commit changes to inference.yaml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/inference.yaml
          git commit -m "Update InferenceService storageUri to point to the new model in S3"
          git push origin main